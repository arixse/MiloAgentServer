[project]
name = "MiloAgent"
version = "0.1.0"
description = "Deep Agent template for LangSmith/LangGraph deployment"
readme = "README.md"
requires-python = ">=3.11"
#requires-python = ">=3.11, <3.12"
dependencies = [
    "asyncio>=4.0.0",
    "bs4>=0.0.2",
    "deepagents>=0.4.0",
    "fastapi[all]>=0.136.3",
    "fpdf2>=2.8.7",
    "langchain-daytona",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.2.2",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-mongodb>=0.4.0",
    "langgraph-sdk>=0.1.0",
    "langgraph-store-mongodb>=0.3.0",
    "langsmith>=0.3.0",
    "openpyxl>=3.1.5",
    "opensandbox-code-interpreter>=0.1.2",
    "pdfplumber>=0.11.9",
    "playwright>=1.60.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0.1",
    "python-pptx>=1.0.2",
    "redis>=5.0.0",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.10",
    "pytest>=8.3.5",
    "ruff>=0.8.0",
]

[tool.uv.build-backend]
module-name = "deep_agent"
source-include = ["langgraph.json", ".env.example", "Makefile"]
