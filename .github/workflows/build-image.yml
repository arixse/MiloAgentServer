# ===========================================================================
# MiloAgent — CI: 版本发布时构建 Docker 镜像并推送到 GHCR
# ===========================================================================
# 触发方式:
#   1. 创建 GitHub Release（发布 / 预发布 / draft 发布）
#   2. 手动触发 (workflow_dispatch)
# ===========================================================================
name: Build & Push Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/milo-agent-server
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}/milo-agent

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # -------------------------------------------------------------------
      # 1. Checkout
      # -------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # 2. 提取版本号
      # -------------------------------------------------------------------
      - name: Set version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            # 去掉 refs/tags/ 前缀和 v 前缀
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "version=manual-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          fi

      # -------------------------------------------------------------------
      # 3. 登录 GitHub Container Registry
      # -------------------------------------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------------
      # 3.5 检查是否配置了 Docker Hub 凭据
      # -------------------------------------------------------------------
      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "login=true" >> $GITHUB_OUTPUT
          else
            echo "login=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.login == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------------------------------------------------
      # 4. 生成镜像标签列表
      # -------------------------------------------------------------------
      - name: Generate image tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          TAGS="${TAGS}\n${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          if [ "${{ steps.dockerhub.outputs.login }}" = "true" ]; then
            TAGS="${TAGS}\n${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.version }}"
            TAGS="${TAGS}\n${{ env.DOCKERHUB_IMAGE }}:latest"
          fi
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo -e "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # -------------------------------------------------------------------
      # 5. 设置 Docker Buildx（加速 + 多平台支持）
      # -------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------------------------------------------------
      # 6. 构建并推送镜像
      # -------------------------------------------------------------------
      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------------------------------------------------
      # 7. 摘要
      # -------------------------------------------------------------------
      - name: Summary
        run: |
          echo "### 镜像已构建并推送" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ steps.version.outputs.version }} | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| latest | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 使用方式" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
